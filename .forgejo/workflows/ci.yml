# ─────────────────────────────────────────────────────────────────────────────
# chameleon-ci / betterlint — Build & Publish
#
# lint:        hadolint-Binary direkt (kein Container nötig)
# build-test:  Docker-in-Docker via services: — kein container: am Job
# publish:     DinD + buildx für linux/amd64 + linux/arm64
#
# Warum kein container: am Job? Forgejo checkout@v4 braucht Node.js im
# Container. docker:cli hat kein Node.js → exec failed. Lösung: Steps
# laufen auf dem Host-Runner (hat Node.js), DinD als Service daneben.
#
# Voraussetzung: Forgejo-Org-Secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
# ─────────────────────────────────────────────────────────────────────────────

name: ci

on:
  push:
    branches: [main, "claude/*"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tcwlab/betterlint
  DOCKER_CLI_URL: https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz

jobs:

  # ---------------------------------------------------------------------------
  lint:
    name: Dockerfile Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: hadolint
        run: |
          curl -fsSL \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o /tmp/hadolint
          chmod +x /tmp/hadolint
          /tmp/hadolint --ignore DL3018 Dockerfile

  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Smoke-Test (amd64)
    runs-on: ubuntu-22.04
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: "--privileged"
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install Docker CLI
        run: |
          curl -fsSL "${{ env.DOCKER_CLI_URL }}" -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          docker version
      - name: Build (amd64)
        run: |
          docker build \
            --build-arg BETTERLINT_VERSION=dev \
            -t "${{ env.IMAGE }}:test" .
      - name: Smoke-Test
        run: |
          docker run --rm "${{ env.IMAGE }}:test" shellcheck --version
          docker run --rm "${{ env.IMAGE }}:test" markdownlint-cli2 --version
          docker run --rm "${{ env.IMAGE }}:test" commitlint --version
          docker run --rm "${{ env.IMAGE }}:test" spectral --version
          docker run --rm "${{ env.IMAGE }}:test" \
            python3 -c "from gherkin.parser import Parser; print('gherkin ok')"

  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Docker Hub (linux/amd64 + linux/arm64)
    runs-on: ubuntu-22.04
    needs: [lint, build-test]
    if: startsWith(github.ref, 'refs/tags/v')
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: "--privileged"
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install Docker CLI + buildx
        run: |
          curl -fsSL "${{ env.DOCKER_CLI_URL }}" -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version

      - name: Set up QEMU (arm64 emulation)
        run: |
          docker run --rm --privileged \
            multiarch/qemu-user-static --reset -p yes

      - name: Set up Buildx builder
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Push (multi-arch)
        run: |
          VER="${{ steps.version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BETTERLINT_VERSION="${VER}" \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${VER}" \
            --push \
            .
