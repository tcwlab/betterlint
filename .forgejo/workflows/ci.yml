# ─────────────────────────────────────────────────────────────────────────────
# tcwlab / betterlint — Build & Publish
#
# CI images:
#   tcwlab/buildx:0.33.0   → docker build / buildx (amd64 + arm64)
#   tcwlab/trivy:0.70.0    → security scan
#   tcwlab/forgejo-build:betterlint-<sha>  → betterlint self-check (incl. hadolint)
#
# Note: no separate lint job — the betterlint-check job lints the
# Dockerfile against the staging image. A standalone lint job would
# require tcwlab/betterlint:latest, which is exactly what this workflow
# publishes (bootstrap cycle).
# Checkout: shell-based (git init + git fetch) — no Node.js required.
# Docker daemon: tcp://docker-in-docker:2375 (runner-net).
#
# PR reporting: every job writes its own PR comment (no shared state).
#   security      → comment with marker <!-- trivy-report -->
#   betterlint    → comment with marker <!-- betterlint-report -->
#   On the next run the same job updates its comment instead of creating
#   a new one.
#
# Versioning: Semantic Release (v*.*.*) via release.yml
#   → tcwlab/betterlint:<semver>          immutable  (e.g. 1.2.47)
#   → tcwlab/betterlint:<major>.<minor>   floating   (e.g. 1.2)
#   → tcwlab/betterlint:<major>           floating   (e.g. 1)
#   → tcwlab/betterlint:latest            floating
# ─────────────────────────────────────────────────────────────────────────────

name: ci

on:
  push:
    branches: [main, "feature/*", "claude/*"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tcwlab/betterlint
  DOCKER_BUILDKIT: "1"

jobs:

  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Smoke Test (amd64)
    runs-on: ubuntu-22.04
    container:
      image: tcwlab/buildx:0.33.0
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Build (amd64)
        run: |
          docker build \
            --build-arg BETTERLINT_VERSION=dev \
            -t "${{ env.IMAGE }}:test" .

      - name: Smoke test
        run: |
          # Image's ENTRYPOINT is locked to /usr/local/bin/betterlint
          # (Dockerfile end). The wrapper itself is verified with the default
          # entrypoint; every bundled tool is verified by overriding the
          # entrypoint so we exercise the actual binary path, not the wrapper's
          # arg parser.
          docker run --rm "${{ env.IMAGE }}:test" --version
          docker run --rm --entrypoint shellcheck       "${{ env.IMAGE }}:test" --version
          docker run --rm --entrypoint markdownlint-cli2 "${{ env.IMAGE }}:test" --version
          docker run --rm --entrypoint commitlint       "${{ env.IMAGE }}:test" --version
          docker run --rm --entrypoint spectral         "${{ env.IMAGE }}:test" --version
          docker run --rm --entrypoint python3          "${{ env.IMAGE }}:test" \
            -c "from gherkin.parser import Parser; print('gherkin ok')"

      - name: Hardened runtime smoke-test
        run: |
          # Verify the image still works under the runtime restrictions we
          # recommend in the README. If any of these flags break the wrapper,
          # the README is lying to consumers.
          #   --read-only           : root FS is mounted read-only
          #   --tmpfs /tmp          : writable scratch for tools that need it
          #   --cap-drop=ALL        : drop every Linux capability
          #   --security-opt        : block privilege escalation via setuid
          #   --user 10001:10001    : matches the Dockerfile's USER directive
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user 10001:10001 \
            "${{ env.IMAGE }}:test" --version

      - name: ENTRYPOINT lockdown verification
        run: |
          # The Dockerfile locks ENTRYPOINT to /usr/local/bin/betterlint so
          # `docker run <image> /bin/sh -c true` MUST fail (the shell becomes
          # an arg to the wrapper, not the entrypoint). If this run somehow
          # succeeds, the lockdown was bypassed (e.g. someone reverted the
          # ENTRYPOINT line) and the README is making promises the image
          # cannot keep.
          if docker run --rm "${{ env.IMAGE }}:test" /bin/sh -c true 2>/dev/null; then
            echo "FAIL: shell reachable via image — ENTRYPOINT lockdown not enforced"
            exit 1
          fi
          echo "OK: shell not reachable, ENTRYPOINT lockdown enforced"

      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push to staging
        run: |
          TOOL=$(echo "${{ env.IMAGE }}" | cut -d'/' -f2)
          docker tag "${{ env.IMAGE }}:test" "tcwlab/forgejo-build:${TOOL}-${{ github.sha }}"
          docker push "tcwlab/forgejo-build:${TOOL}-${{ github.sha }}"

      - name: Trivy gate (fixable HIGH/CRITICAL → fail build)
        run: |
          # Two-pass Trivy strategy:
          #   1. THIS step is the HARD gate: any HIGH/CRITICAL CVE with an
          #      available upstream fix fails the build immediately
          #      (--ignore-unfixed). The downstream `security` and `publish`
          #      jobs depend on `build-test` and therefore never run on a
          #      gated failure.
          #   2. The `security` job below runs a non-gating full scan
          #      (--exit-code 0) and posts the result as a PR comment so
          #      unfixable CVEs are still visible to maintainers.
          TOOL=$(echo "${{ env.IMAGE }}" | cut -d'/' -f2)
          docker run --rm \
            -e TRIVY_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            -e TRIVY_PASSWORD="${{ secrets.DOCKERHUB_TOKEN }}" \
            tcwlab/trivy:0.70.0 image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress \
            "tcwlab/forgejo-build:${TOOL}-${{ github.sha }}"

  # ---------------------------------------------------------------------------
  security:
    name: Trivy security scan
    runs-on: ubuntu-22.04
    needs: [build-test]
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Install Docker CLI
        run: |
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-29.4.2.tgz" \
            -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker

      - name: Trivy scan (JSON)
        run: |
          TOOL=$(echo "${{ env.IMAGE }}" | cut -d'/' -f2)
          docker run --rm \
            -e TRIVY_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            -e TRIVY_PASSWORD="${{ secrets.DOCKERHUB_TOKEN }}" \
            tcwlab/trivy:0.70.0 image \
            --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed \
            --format json \
            "tcwlab/forgejo-build:${TOOL}-${{ github.sha }}" \
            > /tmp/trivy-report.json

      - name: Post Trivy result as PR comment
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          SCANNED_IMAGE: "tcwlab/forgejo-build:betterlint-${{ github.sha }}"
          TRIVY_IMAGE: "tcwlab/trivy:0.70.0"
        run: |
          python3 << 'EOF'
          import os, json, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          MARKER  = "<!-- trivy-report -->"
          token   = os.environ["FORGEJO_TOKEN"]
          repo    = os.environ["REPO"]
          event   = os.environ["GITHUB_EVENT_NAME"]
          api     = "https://git.mon.k8b.co/api/v1"
          hdrs    = {"Authorization": f"token {token}", "Content-Type": "application/json"}

          def get(url):
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def post(url, body):
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(), headers=hdrs, method="POST")
              with urllib.request.urlopen(req) as r:
                  return r.status

          def patch(url, body):
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(), headers=hdrs, method="PATCH")
              with urllib.request.urlopen(req) as r:
                  return r.status

          # Determine PR number
          pr_number = None
          if event == "pull_request":
              pr_number = os.environ["PR_NUMBER"]
          else:
              branch = os.environ["HEAD_BRANCH"]
              try:
                  for pr in get(f"{api}/repos/{repo}/pulls?state=open&limit=50"):
                      if pr.get("head", {}).get("ref") == branch:
                          pr_number = str(pr["number"])
                          break
              except urllib.error.URLError as e:
                  print(f"PR lookup failed: {e}")

          if not pr_number:
              print("No open PR — comment will not be posted")
              raise SystemExit(0)

          # Build the report
          with open("/tmp/trivy-report.json") as f:
              report = json.load(f)

          icon = {"CRITICAL": "\U0001f534", "HIGH": "\U0001f7e0"}
          rows = []
          for result in report.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  sev   = v.get("Severity", "")
                  pkg   = v.get("PkgName", "")
                  inst  = v.get("InstalledVersion", "")
                  fixed = v.get("FixedVersion", "") or "—"
                  cve   = v.get("VulnerabilityID", "")
                  url   = next(
                      (r for r in v.get("References", []) if "nvd.nist.gov" in r),
                      v.get("PrimaryURL", ""))
                  cve_link = f"[{cve}]({url})" if url else cve
                  rows.append((sev, icon.get(sev, "⚪"), pkg, inst, fixed, cve_link))

          rows.sort(key=lambda r: ({"CRITICAL": 0, "HIGH": 1}.get(r[0], 9), r[2]))
          counts = {s: sum(1 for r in rows if r[0] == s) for s in ["CRITICAL", "HIGH"]}
          total  = sum(counts.values())

          if total == 0:
              body = "**✅ Security scan — no HIGH/CRITICAL vulnerabilities**"
          else:
              parts = [f"{counts[s]} {s}" for s in ["CRITICAL", "HIGH"] if counts[s]]
              body  = f"**⚠️ Security scan — {', '.join(parts)}** (fixable vulnerabilities only)\n\n"
              body += "| Severity | Package | Installed | Fixed | CVE |\n"
              body += "| --- | --- | --- | --- | --- |\n"
              for _, ico, pkg, inst, fixed, cve_link in rows:
                  body += f"| {ico} | `{pkg}` | {inst} | {fixed} | {cve_link} |\n"

          scan_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          comment   = (
              f"{MARKER}\n{body}\n\n"
              f"_Scanned: `{os.environ['SCANNED_IMAGE']}` "
              f"· Tool: `{os.environ['TRIVY_IMAGE']}` "
              f"· {scan_date}_"
          )

          # Look for an existing comment (paginated, max 200)
          existing_id = None
          page = 1
          while True:
              comments = get(f"{api}/repos/{repo}/issues/{pr_number}/comments?limit=50&page={page}")
              if not comments:
                  break
              for c in comments:
                  if MARKER in (c.get("body") or ""):
                      existing_id = c["id"]
                      break
              if existing_id or len(comments) < 50:
                  break
              page += 1

          if existing_id:
              status = patch(f"{api}/repos/{repo}/issues/comments/{existing_id}", {"body": comment})
              print(f"PR #{pr_number}: Trivy comment updated (HTTP {status})")
          else:
              status = post(f"{api}/repos/{repo}/issues/{pr_number}/comments", {"body": comment})
              print(f"PR #{pr_number}: Trivy comment created (HTTP {status})")
          EOF

  # ---------------------------------------------------------------------------
  betterlint-check:
    name: Betterlint self-check
    runs-on: ubuntu-22.04
    needs: [build-test]
    container:
      image: "tcwlab/forgejo-build:betterlint-${{ github.sha }}"
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: "--user root"
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$(pwd)"
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Run betterlint
        run: |
          set +e
          betterlint --dir . --markdown 2>&1 | tee /tmp/betterlint-report.md
          LINT_EXIT="${PIPESTATUS[0]}"
          exit "${LINT_EXIT}"

      - name: Post betterlint result as PR comment
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          IMAGE_REF: "tcwlab/forgejo-build:betterlint-${{ github.sha }}"
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error
          from datetime import datetime, timezone

          MARKER  = "<!-- betterlint-report -->"
          token   = os.environ["FORGEJO_TOKEN"]
          repo    = os.environ["REPO"]
          event   = os.environ["GITHUB_EVENT_NAME"]
          api     = "https://git.mon.k8b.co/api/v1"
          hdrs    = {"Authorization": f"token {token}", "Content-Type": "application/json"}

          def get(url):
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def post(url, body):
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(), headers=hdrs, method="POST")
              with urllib.request.urlopen(req) as r:
                  return r.status

          def patch(url, body):
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(), headers=hdrs, method="PATCH")
              with urllib.request.urlopen(req) as r:
                  return r.status

          # Determine PR number
          pr_number = None
          if event == "pull_request":
              pr_number = os.environ["PR_NUMBER"]
          else:
              branch = os.environ["HEAD_BRANCH"]
              try:
                  for pr in get(f"{api}/repos/{repo}/pulls?state=open&limit=50"):
                      if pr.get("head", {}).get("ref") == branch:
                          pr_number = str(pr["number"])
                          break
              except urllib.error.URLError as e:
                  print(f"PR lookup failed: {e}")

          if not pr_number:
              print("No open PR — comment will not be posted")
              raise SystemExit(0)

          # Read the report
          try:
              with open("/tmp/betterlint-report.md") as f:
                  report = f.read().strip()
          except FileNotFoundError:
              report = "**⚠️ betterlint report not found**"

          scan_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          comment   = f"{MARKER}\n{report}\n\n_Scan: `{os.environ['IMAGE_REF']}` — {scan_date}_"

          # Look for an existing comment
          existing_id = None
          page = 1
          while True:
              comments = get(f"{api}/repos/{repo}/issues/{pr_number}/comments?limit=50&page={page}")
              if not comments:
                  break
              for c in comments:
                  if MARKER in (c.get("body") or ""):
                      existing_id = c["id"]
                      break
              if existing_id or len(comments) < 50:
                  break
              page += 1

          if existing_id:
              try:
                  status = patch(f"{api}/repos/{repo}/issues/comments/{existing_id}", {"body": comment})
                  print(f"PR #{pr_number}: betterlint comment updated (HTTP {status})")
              except urllib.error.HTTPError as e:
                  if e.code >= 500:
                      print(f"PATCH failed ({e.code}) — creating a new comment")
                      status = post(f"{api}/repos/{repo}/issues/{pr_number}/comments", {"body": comment})
                      print(f"PR #{pr_number}: betterlint comment created (HTTP {status})")
                  else:
                      raise
          else:
              status = post(f"{api}/repos/{repo}/issues/{pr_number}/comments", {"body": comment})
              print(f"PR #{pr_number}: betterlint comment created (HTTP {status})")
          EOF

  # ---------------------------------------------------------------------------
  publish:
    name: Publish to Docker Hub (linux/amd64 + linux/arm64)
    runs-on: ubuntu-22.04
    needs: [build-test, security, betterlint-check]
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: tcwlab/buildx:0.33.0
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Extract version from tag
        id: version
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VER%%.*}"
          MINOR="${VER%.*}"
          echo "version=${VER}"   >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}"   >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}"   >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Buildx builder
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & push (multi-arch)
        run: |
          VER="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true \
            --provenance=mode=max \
            --build-arg BETTERLINT_VERSION="${VER}" \
            -t "${{ env.IMAGE }}:${VER}" \
            -t "${{ env.IMAGE }}:${MINOR}" \
            -t "${{ env.IMAGE }}:${MAJOR}" \
            -t "${{ env.IMAGE }}:latest" \
            --push \
            .

  # ---------------------------------------------------------------------------
  sync-readme:
    name: Sync README to Docker Hub
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    container:
      image: alpine:3.23
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          apk add --no-cache git jq curl ca-certificates
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Push README to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: betterlint
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Content-Type: application/json" -X POST \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          curl -fsS -X PATCH \
            -H "Authorization: JWT $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --rawfile body README.md '{full_description: $body}')" \
            "https://hub.docker.com/v2/repositories/tcwlab/${REPO}/" > /dev/null
          echo "✓ README synced to hub.docker.com/r/tcwlab/${REPO}"
